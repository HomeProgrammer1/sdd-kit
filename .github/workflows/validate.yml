name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repository checks (manifests, guard, diagrams, prototype, Figma plugin test)
        run: python3 scripts/validate.py
      - name: Figma plugin against Figma's official API typings
        run: |
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/figma-types" typescript@6 @figma/plugin-typings@1
          bash scripts/typecheck_figma.sh "$RUNNER_TEMP/figma-types/node_modules"
      - name: Plugin manifests (Claude Code CLI)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/cc" @anthropic-ai/claude-code
          cli="$RUNNER_TEMP/cc/node_modules/.bin/claude"
          "$cli" plugin validate .
          for p in plugins/*; do "$cli" plugin validate "$p"; done
